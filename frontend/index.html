<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PustakHub — Secure Library & Identity Management</title>
    <meta name="description" content="PustakHub is a secure, RBAC-enforced library management platform with real-time updates, MFA, and comprehensive audit trails." />
    <!-- Anti-FOUC: Initialize theme before React renders -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("pustakhub_theme") || "dark";
          var valid = ["light", "dark", "system"];
          if (!valid.includes(stored)) stored = "dark";
          var effective = stored;
          if (stored === "system") {
            effective = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.classList.add(effective);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
